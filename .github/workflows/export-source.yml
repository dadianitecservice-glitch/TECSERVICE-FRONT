name: Prepare isolated local preview

on:
  push:
    branches:
      - automation/export-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout unchanged main snapshot
        uses: actions/checkout@v4
        with:
          ref: 5f816bc0f156f6c96707a3201731299ae9f1ffed
          persist-credentials: false
      - name: Node matching local preview environment
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Install exact lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Package dependencies preserving symlinks
        run: tar -czf tecservice-node-modules.tar.gz node_modules
      - name: Build unchanged application
        id: build
        continue-on-error: true
        run: pnpm run build 2>&1 | tee preview-build.log
      - name: Test prerendered SEO
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: pnpm run test:seo 2>&1 | tee preview-tests.log
      - name: Package preview assets
        if: always()
        run: |
          if [ -d dist ]; then tar -czf tecservice-dist.tar.gz dist; fi
      - name: Export local runtime dependencies and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tecservice-local-runtime
          path: |
            tecservice-node-modules.tar.gz
            tecservice-dist.tar.gz
            preview-build.log
            preview-tests.log
          if-no-files-found: warn
          retention-days: 1
