# Include the active directives below inside the canonical HTTPS `server` block
# whose server_name is tecservice.ge. Keep the existing TLS and /api/ proxy rules
# at server level; do not nest API locations inside the frontend location below.
# Load mime.types in the existing http block. Run nginx -t before reload.
#
# Configure these TWO SIBLING server blocks in the http context (not inside the
# canonical server). Replace certificate paths with the deployed www certificate;
# HTTPS must complete TLS before it can redirect. Preserve any ACME challenge
# location used by the existing certificate renewal setup.
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name tecservice.ge www.tecservice.ge;
#     location / { return 308 https://tecservice.ge$request_uri; }
# }
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name www.tecservice.ge;
#     ssl_certificate /path/to/deployed-www-fullchain.pem;
#     ssl_certificate_key /path/to/deployed-www-privkey.pem;
#     return 308 https://tecservice.ge$request_uri;
# }
#
# Both host redirects use the literal canonical origin and retain the full path
# and query. They must not use $host as the destination. This file is a deployment
# template, not evidence that the live configuration has been changed or tested.
# Nginx add_header directives replace inherited add_header lists on older versions.
# Retain the site's security-header include in every scope that defines add_header.

root /var/www/tecservice/dist;
index index.html;

charset utf-8;
server_tokens off;

# Scope frontend caching and compression to static files. Existing sibling API
# proxy locations retain their own upstream/private response-header policy.
location / {
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/xml image/svg+xml;
    expires off;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;

    # Test files, not bare directories: /services/ must be 404, not a directory
    # index 403 or a successful fallback to Home.
    try_files $uri $uri/index.html =404;

    location = / {
        try_files /index.html =404;
    }

    location = /services/laptop-repair { return 308 /services/laptop-repair/$is_args$args; }
    location = /services/computer-repair { return 308 /services/computer-repair/$is_args$args; }
    location = /services/data-recovery { return 308 /services/data-recovery/$is_args$args; }
    location = /services/console-repair { return 308 /services/console-repair/$is_args$args; }
    location = /services/drone-repair { return 308 /services/drone-repair/$is_args$args; }
    location = /services/mobile-tablet-repair { return 308 /services/mobile-tablet-repair/$is_args$args; }
    location = /services/other-electronics { return 308 /services/other-electronics/$is_args$args; }
    location = /contact { return 308 /contact/$is_args$args; }
    location = /about { return 308 /about/$is_args$args; }
    location = /terms { return 308 /terms/$is_args$args; }
    location = /privacy { return 308 /privacy/$is_args$args; }
    location = /blog { return 308 /blog/$is_args$args; }
    location = /account { return 308 /account/$is_args$args; }
    location = /account/ {
        try_files /account/index.html =404;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /account/index.html {
        return 308 /account/$is_args$args;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /services/laptop-repair/ { try_files /services/laptop-repair/index.html =404; }
    location = /services/computer-repair/ { try_files /services/computer-repair/index.html =404; }
    location = /services/data-recovery/ { try_files /services/data-recovery/index.html =404; }
    location = /services/console-repair/ { try_files /services/console-repair/index.html =404; }
    location = /services/drone-repair/ { try_files /services/drone-repair/index.html =404; }
    location = /services/mobile-tablet-repair/ { try_files /services/mobile-tablet-repair/index.html =404; }
    location = /services/other-electronics/ { try_files /services/other-electronics/index.html =404; }
    location = /contact/ { try_files /contact/index.html =404; }
    location = /about/ { try_files /about/index.html =404; }
    location = /terms/ { try_files /terms/index.html =404; }
    location = /privacy/ { try_files /privacy/index.html =404; }
    location = /blog/ { try_files /blog/index.html =404; }

    # Published articles are static documents; only existing articles redirect.
    location /blog/ {
        try_files $uri $uri/index.html =404;
        location ~ ^/blog/[a-z0-9-]+$ {
            if (-f $request_filename/index.html) { return 308 $uri/$is_args$args; }
            return 404;
        }
    }

    # Direct index documents consolidate to their directory URL. try_files above
    # serves matching files in place, so canonical requests do not redirect in a loop.
    # Build manifests and other dotfiles are not public site content. An existing
    # ACME challenge location can still serve .well-known during certificate renewal.
    location ~ /\.(?!well-known(?:/|$)) { return 404; }
    location ~ "^(?<canonical_directory>/(?:[a-z0-9-]+/)*)index\\.html$" {
        if (!-f $request_filename) { return 404; }
        return 308 $canonical_directory$is_args$args;
    }

    # English pages are static documents too; preserve their real 404 status.
    location = /en { return 308 /en/$is_args$args; }
    location /en/ {
        error_page 404 /en/404.html;
        try_files $uri $uri/index.html =404;
        location = /en/ { try_files /en/index.html =404; }
        location = /en/services/laptop-repair { return 308 /en/services/laptop-repair/$is_args$args; }
        location = /en/services/computer-repair { return 308 /en/services/computer-repair/$is_args$args; }
        location = /en/services/data-recovery { return 308 /en/services/data-recovery/$is_args$args; }
        location = /en/services/console-repair { return 308 /en/services/console-repair/$is_args$args; }
        location = /en/services/drone-repair { return 308 /en/services/drone-repair/$is_args$args; }
        location = /en/services/mobile-tablet-repair { return 308 /en/services/mobile-tablet-repair/$is_args$args; }
        location = /en/services/other-electronics { return 308 /en/services/other-electronics/$is_args$args; }
        location = /en/contact { return 308 /en/contact/$is_args$args; }
        location = /en/services/laptop-repair/ { try_files /en/services/laptop-repair/index.html =404; }
        location = /en/services/computer-repair/ { try_files /en/services/computer-repair/index.html =404; }
        location = /en/services/data-recovery/ { try_files /en/services/data-recovery/index.html =404; }
        location = /en/services/console-repair/ { try_files /en/services/console-repair/index.html =404; }
        location = /en/services/drone-repair/ { try_files /en/services/drone-repair/index.html =404; }
        location = /en/services/mobile-tablet-repair/ { try_files /en/services/mobile-tablet-repair/index.html =404; }
        location = /en/services/other-electronics/ { try_files /en/services/other-electronics/index.html =404; }
        location = /en/contact/ { try_files /en/contact/index.html =404; }
        location = /en/about { return 308 /en/about/$is_args$args; }
        location = /en/about/ { try_files /en/about/index.html =404; }
        location = /en/terms { return 308 /en/terms/$is_args$args; }
        location = /en/privacy { return 308 /en/privacy/$is_args$args; }
        location = /en/blog { return 308 /en/blog/$is_args$args; }
        location = /en/account { return 308 /en/account/$is_args$args; }
        location = /en/account/ {
            try_files /en/account/index.html =404;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location = /en/account/index.html {
            return 308 /en/account/$is_args$args;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location = /en/terms/ { try_files /en/terms/index.html =404; }
        location = /en/privacy/ { try_files /en/privacy/index.html =404; }
        location = /en/blog/ { try_files /en/blog/index.html =404; }
        location = /en/404.html {
            internal;
            add_header Cache-Control "no-cache" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location /en/blog/ {
            try_files $uri $uri/index.html =404;
            location ~ ^/en/blog/[a-z0-9-]+$ {
                if (-f $request_filename/index.html) { return 308 $uri/$is_args$args; }
                return 404;
            }
        }
        location ~ /\.(?!well-known(?:/|$)) { return 404; }
        location ~ "^(?<english_canonical_directory>/en/(?:[a-z0-9-]+/)*)index\\.html$" {
            if (!-f $request_filename) { return 404; }
            return 308 $english_canonical_directory$is_args$args;
        }
    }

    location = /robots.txt { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }

    # Vite emits eight-character content hashes at the top level of /assets/.
    # Only those versioned bundles/fonts can be cached immutably across deployments.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\\.(?:js|css|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/assets/.*\.(?:avif|webp|png|jpe?g|gif|svg)$ {
        try_files $uri =404;
        # These filenames are stable across edits; do not pin old photos for a month.
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
