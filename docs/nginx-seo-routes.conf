# Include these directives inside the canonical HTTPS `server` block for
# tecservice.ge. Keep the existing TLS certificate and `/api/` proxy rules.

root /var/www/tecservice/dist;
index index.html;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

location = / {
    try_files /index.html =404;
}

location = /services/laptop-repair { return 308 /services/laptop-repair/; }
location = /services/computer-repair { return 308 /services/computer-repair/; }
location = /services/data-recovery { return 308 /services/data-recovery/; }
location = /services/console-repair { return 308 /services/console-repair/; }
location = /services/drone-repair { return 308 /services/drone-repair/; }
location = /services/mobile-tablet-repair { return 308 /services/mobile-tablet-repair/; }
location = /services/other-electronics { return 308 /services/other-electronics/; }

location = /services/laptop-repair/ { try_files /services/laptop-repair/index.html =404; }
location = /services/computer-repair/ { try_files /services/computer-repair/index.html =404; }
location = /services/data-recovery/ { try_files /services/data-recovery/index.html =404; }
location = /services/console-repair/ { try_files /services/console-repair/index.html =404; }
location = /services/drone-repair/ { try_files /services/drone-repair/index.html =404; }
location = /services/mobile-tablet-repair/ { try_files /services/mobile-tablet-repair/index.html =404; }
location = /services/other-electronics/ { try_files /services/other-electronics/index.html =404; }

location = /robots.txt { try_files /robots.txt =404; }
location = /sitemap.xml { try_files /sitemap.xml =404; }

location ~* ^/assets/.*\.(?:js|css|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* ^/assets/.*\.(?:avif|webp|png|jpe?g|gif|svg)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

error_page 404 /404.html;
location = /404.html {
    internal;
}

# Unknown and unfinished URLs must return a real HTTP 404, never Home with 200.
location / {
    try_files $uri $uri/ =404;
}
